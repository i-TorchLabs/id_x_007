name: id_x_007

services:
  db:
    image: docker.io/library/postgres:18
    container_name: id_x_007_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: Asia/Shanghai
    ports:
      - "55432:5432"
    volumes:
      - id_x_007_db_data:/var/lib/postgresql
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  service:
    build:
      context: ../../..
      dockerfile: x_models/id_x_007/ops/Dockerfile.service
    image: id_x_007_service:latest
    container_name: id_x_007_service
    restart: unless-stopped
    environment:
      DB_NAME: ${POSTGRES_DB}
      DB_HOST: db
      DB_PORT: "5432"
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      PA_ADMIN_PASSWORD: ${PA_ADMIN_PASSWORD:-}
      PA_OAUTH_CLIENT_ID: ${PA_OAUTH_CLIENT_ID:-}
      PA_OAUTH_CLIENT_SECRET: ${PA_OAUTH_CLIENT_SECRET:-}
      PA_OAUTH_REDIRECT_URI: ${PA_OAUTH_REDIRECT_URI:-}
      PA_OAUTH_MOCK: ${PA_OAUTH_MOCK:-}
      PA_SMTP_HOST: ${PA_SMTP_HOST:-}
      PA_SMTP_PORT: ${PA_SMTP_PORT:-587}
      PA_SMTP_USER: ${PA_SMTP_USER:-}
      PA_SMTP_PASSWORD: ${PA_SMTP_PASSWORD:-}
      PA_MAIL_FROM: ${PA_MAIL_FROM:-}
      PA_SCHEDULER_DISABLED: ${PA_SCHEDULER_DISABLED:-}
      PA_MAX_UPLOAD_BYTES: ${PA_MAX_UPLOAD_BYTES:-}
      PROJECT_PATH: /app/i-Core
      TZ: Asia/Shanghai
    volumes:
      # 日志挂载:宿主机 x_models/id_x_007/logs -> 容器日志目录 /app/i-Core/logs
      # (日志路径由 utils/log_util.py 按 PROJECT_PATH + config 中 logs/*.log 解析)
      - ../logs:/app/i-Core/logs
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ../web
      dockerfile: Dockerfile
    image: id_x_007_web:latest
    container_name: id_x_007_web
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    depends_on:
      - service

  haproxy:
    image: docker.io/library/haproxy:3.2
    container_name: id_x_007_haproxy
    restart: unless-stopped
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    environment:
      SERVICE_HOST: service
      WEB_HOST: web
    ports:
      - "8005:8080"
    depends_on:
      - service
      - web

volumes:
  id_x_007_db_data:
