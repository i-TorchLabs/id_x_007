name: id_x_007

# 数据库：不再内置 PostgreSQL 容器，service 直连外部库（连接参数见 ops/.env 的 DB_*）。
# 表结构与预置数据（管理员 / 邮件模板 / SSO 配置）由应用启动时幂等创建，
# ops/init/*.sql 仅作手动初始化外部库的参考。
# 若外部库在容器宿主机本机，DB_HOST 填 host.containers.internal 或宿主机内网 IP。

services:
  service:
    build:
      context: ../../..
      dockerfile: x_models/id_x_007/ops/Dockerfile.service
    image: id_x_007_service:latest
    container_name: id_x_007_service
    restart: unless-stopped
    environment:
      DB_NAME: ${DB_NAME}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      PROJECT_PATH: /app/i-Core
      TZ: Asia/Shanghai
    volumes:
      # 日志挂载:宿主机 x_models/id_x_007/logs -> 容器日志目录 /app/i-Core/logs
      # (日志路径由 utils/log_util.py 按 PROJECT_PATH + config 中 logs/*.log 解析)
      - ../logs:/app/i-Core/logs

  web:
    build:
      context: ../web
      dockerfile: Dockerfile
    image: id_x_007_web:latest
    container_name: id_x_007_web
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    depends_on:
      - service

  haproxy:
    image: docker.io/library/haproxy:3.0
    container_name: id_x_007_haproxy
    restart: unless-stopped
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    environment:
      SERVICE_HOST: service
      WEB_HOST: web
    ports:
      - "8007:8080"
    depends_on:
      - service
      - web
